name: Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: prod or np
        options: 
        - np
        - prod
  push:
    branches:
      - main
      
jobs:
  terraform:
    strategy:
      matrix:
        region: [ 'us-east-1' ]
    environment: ${{ inputs.environment == '' && 'np' || inputs.environment }}
    runs-on: ubuntu-latest

    steps:
    - name: Set environment variable
      id: set-env
      run: echo "ENVIRONMENT=${{ inputs.environment == '' && 'np' || inputs.environment }}" >> $GITHUB_ENV

    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: 1.0.0

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ matrix.region }}

    - name: Initialize Terraform
      working-directory: ./infrastructure/terraform/
      run: terraform init
      
    # - name: Validate Terraform configuration
    #   working-directory: ./infrastructure/terraform/
    #   run: terraform validate

    - name: Plan Terraform deployment
      working-directory: ./infrastructure/terraform/
      run: terraform plan -var-file="${{env.ENVIRONMENT}}.tfvars"

    - name: Apply Terraform configuration
      working-directory: ./infrastructure/terraform/
      run: terraform apply -auto-approve -var-file="${{env.ENVIRONMENT}}.tfvars"
